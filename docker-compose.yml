services:
  django:
    build: .
    ports: ['8000:8000']
    volumes: [.:/code]
    depends_on: [db]
  db:
    image: postgres:18
    volumes: [postgres_data:/var/lib/postgresql]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

volumes:
  postgres_data:
